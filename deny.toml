[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = ["RUSTSEC-2026-0098", "RUSTSEC-2026-0099"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

skip = [
    { crate = "getrandom@0.2.17", reason = "ring uses this old version" },
    { crate = "hashbrown@0.15.5", reason = "petgraph uses this old version" },
]

skip-tree = [
    { crate = "windows-sys", reason = "a foundational crate for many that bumps far too frequently to ever have a shared version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "s2n-tls"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x677f2d98 }]

[[licenses.clarify]]
name = "winfsp"
expression = "GPL-3.0"

[[licenses.clarify]]
name = "winfsp-sys"
expression = "GPL-3.0"
