[package]
name = "xplane-simulator"
version = "0.8.60"
edition = "2024"
description = "X-Plane tile request simulator for autoortho-rs"
publish = false

[[bin]]
name = "xplane-simulator"
path = "src/main.rs"

[lib]
name = "xplane_simulator"
path = "src/lib.rs"

[dependencies]
autoortho = { path = "../.." }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"