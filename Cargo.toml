[package]
name = "autoortho"
version = "0.6.36"
edition = "2024"
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "A pure Rust reimplementation of AutoOrtho for X-Plane satellite scenery"
repository = "https://github.com/egeland/autoortho-rs"
authors = ["Frode Egeland"]

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "signal",
  "net",
  "time",
  "fs",
  "io-util",
] }
tokio-util = "0.7"
sha2 = "0.11"
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
regex = "1.12"
zstd = "0.13"
lru = "0.16"
crossbeam-channel = "0.5"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0"
parking_lot = "0.12"

# Web
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.29"
hyper = "1.9"
hyper-util = "0.1"
http-body-util = "0.1"
futures-util = "0.3"
http = "1"

# UI
iced = { version = "0.14", features = ["debug", "image", "tokio"] }
# Filesystem info
fs2 = "0.4"

# Util
anyhow = "1.0"
open = "5.3"
rfd = "0.17"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }

# JPEG/image
image = "0.25"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = "8.5"
sevenz-rust = "0.6"
futures-lite = "2.6"

# FUSE support - unifuse provides cross-platform async FUSE (rfuse3 on Unix)
# Note: on Windows, unifuse has compatibility issues, so we use winfsp directly instead
[target.'cfg(not(windows))'.dependencies]
unifuse = "0.1"
libc = "0.2"

# Windows: use winfsp directly (not via unifuse, due to crate version conflicts)
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.12", features = ["full", "system"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.8"
cargo-dist = "0.31"

[package.metadata.dist]
dist-version = "0.2.0"
allow-dirty = ["msi"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
upload-github-release = true
generate-checksums = true
installer-suffix = "-unsigned"

[package.metadata.wix]
upgrade-guid = "B36177BE-EA4D-44FB-B05C-EDDABDAA95CA"
path-guid = "BFD25009-65A4-4D1E-97F1-0030465D90D6"
license = false
eula = false

[lib]
name = "autoortho_lib"
path = "src/lib.rs"

[[bin]]
name = "autoortho"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
