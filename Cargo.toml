[package]
name = "autoortho"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0 OR GPL-3.0"
description = "A pure Rust reimplementation of AutoOrtho for X-Plane satellite scenery"
repository = "https://github.com/egeland/autoortho-rs"
authors = ["Frode Egeland"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "fs", "io-util"] }
tokio-util = "0.7"
sha2 = "0.11"
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
regex = "1.12"
zstd = "0.13"
lru = "0.16"
crossbeam-channel = "0.5"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
parking_lot = "0.12"

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.26"
hyper = "1.6"

# UI
iced = { version = "0.14", features = ["debug", "image", "tokio"] }
# Filesystem info
fs2 = "0.4"

# Util
anyhow = "1.0"
open = "5.3"
rfd = "0.17"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }

# JPEG/image
image = "0.25"
zip = "8.4"
sevenz-rust = "0.6"
futures-lite = "2.6"
libloading = "0.8"

# FUSE support
# Linux/macOS: uses rfuse3 via unifuse
# Windows: uses winfsp directly
[target.'cfg(not(windows))'.dependencies]
unifuse = "0.1"

libc = "0.2"
texpresso = { version = "2.0.2", features = ["rayon"] }

[target.'cfg(windows)'.dependencies]
winfsp = "0.12"

[dev-dependencies]
tempfile = "3"
mockall = "0.14"
criterion = "0.5"

[lib]
name = "autoortho_lib"
path = "src/lib.rs"

[[bin]]
name = "autoortho"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
