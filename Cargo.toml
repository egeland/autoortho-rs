[package]
name = "autoortho"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR GPL-3.0"
description = "A pure Rust reimplementation of AutoOrtho for X-Plane satellite scenery"
repository = "https://github.com/egeland/autoortho-rs"
authors = ["Frode Egeland"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "fs", "io-util"] }
tokio-util = "0.7"
sha2 = "0.11"
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
regex = "1.12"
zstd = "0.13"
lru = "0.16"
crossbeam-channel = "0.5"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.26"
hyper = "1.6"

# UI
iced = { version = "0.14", features = ["debug", "image", "tokio"] }
# Filesystem info
fs2 = "0.4"

# Util
anyhow = "1.0"
open = "5.3"
rfd = "0.17"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }

# JPEG/image
image = "0.25"
zip = "8.4"
futures-lite = "2.6"
libloading = "0.8"

# FUSE (optional — requires macFUSE/libfuse installed)
fuser = { version = "0.14", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
fuse = ["dep:fuser", "dep:libc"]

[dev-dependencies]
tempfile = "3"
mockall = "0.14"
criterion = "0.5"

[lib]
name = "autoortho_lib"
path = "src/lib.rs"

[[bin]]
name = "autoortho"
path = "src/main.rs"
