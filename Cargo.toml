[package]
name = "autoortho"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "A pure Rust reimplementation of AutoOrtho for X-Plane satellite scenery"
repository = "https://github.com/egeland/autoortho-rs"
authors = ["Frode Egeland"]

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "signal",
  "net",
  "time",
  "fs",
  "io-util",
] }
tokio-util = "0.7"
sha2 = "0.11"
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
regex = "1.12"
zstd = "0.13"
lru = "0.18"
crossbeam-channel = "0.5"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0"
parking_lot = "0.12"

# Web
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.29"
hyper = "1.9"
hyper-util = "0.1"
http-body-util = "0.1"
futures-util = "0.3"
http = "1"

# UI
iced = { version = "0.14", features = ["debug", "image", "tokio"] }
# Filesystem info
fs2 = "0.4"

# Util
anyhow = "1.0"
open = "5.3"
rfd = "0.17"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }

# JPEG/image
image = "0.25"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = "8.5"
sevenz-rust = "0.6"
futures-lite = "2.6"

# FUSE support - unifuse provides cross-platform async FUSE (fuse3 on Unix)
# On Windows, use Dokan (user-mode file system)
# Note: on Windows, unifuse has compatibility issues, so we use Dokan directly instead
[target.'cfg(not(windows))'.dependencies]
unifuse = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }

# Windows: use Dokan (user-mode file system)
# Using crates.io version (0.3.x)
[target.'cfg(windows)'.dependencies]
dokan = { version = "0.3", package = "dokan", optional = true }
dokan-sys = { version = "0.3", package = "dokan-sys", optional = true }
widestring = { version = "0.4", optional = true }
winapi = { version = "0.3", optional = true }

[features]
default = ["fuse"]
fuse = [
  "dep:unifuse",
  "dep:libc",
  "dep:dokan",
  "dep:dokan-sys",
  "dep:widestring",
  "dep:winapi",
]

[dev-dependencies]
tempfile = "3"
criterion = "0.8"
cargo-dist = "0.31"




[lib]
name = "autoortho_lib"
path = "src/lib.rs"

[[bin]]
name = "autoortho"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
