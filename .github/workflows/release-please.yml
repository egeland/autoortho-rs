name: Release Please

# Release Please automates releases based on Conventional Commits
# - Creates/updates a Release PR with version bump + CHANGELOG.md updates
# - On merge, pushes a vX.Y.Z tag
# - Tag triggers cargo-dist workflows (release.yml)
#
# Uses GITHUB_TOKEN (simpler than GitHub App)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'egeland'
    steps:
      - uses: actions/checkout@v7

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge for Release PR
        if: steps.release-please.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.release-please.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number')
          gh pr merge --auto --squash "${PR_NUMBER}"
