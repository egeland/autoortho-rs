name: Release Please

# Release Please automates releases based on Conventional Commits
# - Creates/updates a Release PR with version bump + CHANGELOG.md updates
# - On merge, pushes a vX.Y.Z tag
# - Tag triggers cargo-dist workflows (release-linux, release-macos, etc.)
#
# Unlike release-plz, Release Please NEVER invokes cargo,
# so it sidesteps the cargo package issue with Windows dokan dependency.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'egeland'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Enable auto-merge for Release PR
        if: steps.release-please.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.release-please.outputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number')
          gh pr merge --auto --squash "${PR_NUMBER}"