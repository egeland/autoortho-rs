name: Cross-Platform Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libxkbcommon-dev libwayland-dev libvulkan-dev \
                libfuse-dev pkg-config
          - os: macos-latest
            deps: |
              brew update
              brew install macfuse
          - os: windows-latest
            deps: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --lib
