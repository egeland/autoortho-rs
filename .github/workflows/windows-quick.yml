name: Quick Windows Build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run tests after build
        required: false
        default: false
        type: boolean
      build_mode:
        description: Build mode (debug or release)
        required: false
        default: release
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Quick Windows Build
    uses: ./.github/workflows/reusable-windows-build.yml
    with:
      build-mode: ${{ inputs.build_mode }}
      run-tests: ${{ inputs.run_tests }}
      create-artifact: true
      artifact-name: autoortho-windows-quick
