name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref, 'release-please') == false }} # no need to retest on release-please PRs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure components are installed
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  cross-platform:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    if: ${{ startsWith(github.head_ref, 'release-please') == false }} # no need to retest on release-please PRs
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Dokan (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install dokany2 -y
          # Set Dokan library path for dokan-sys
          $dokanPath = "C:\Program Files\Dokan\Dokan 2.0"
          if (Test-Path $dokanPath) {
            "LIB=$dokanPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$dokanPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Dokan found at: $dokanPath"
          } else {
            Write-Host "Dokan not found in default path"
            # Try Chocolatey tools path
            $chocoPath = "C:\ProgramData\chocolatey\lib\dokany2\tools"
            if (Test-Path $chocoPath) {
              "LIB=$chocoPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "$chocoPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib --all-features
        if: matrix.os != 'windows-latest'

      - name: Run library tests (Windows)
        run: cargo test --lib --no-default-features
        if: matrix.os == 'windows-latest'

      - name: Run integration tests
        run: cargo test --test integration_test
        if: matrix.os != 'windows-latest'

      - name: Build with fuse feature (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --all-features
          ./target/debug/autoortho --help
          ./target/debug/autoortho --version