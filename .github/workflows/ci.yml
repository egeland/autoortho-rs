name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Install components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  cross-platform:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install WinFSP (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          msiexec /i winfsp.msi /passive /norestart INSTALLLEVEL=1001 /l* winfsp_install.log

      - name: Verify WinFSP installation
        if: matrix.os == 'windows-latest'
        run: |
          # Check for MSI fatal errors
          if (Select-String -Path winfsp_install.log -Pattern "return value 3" -Quiet) {
              Write-Host "MSI fatal errors found:"
              Get-Content winfsp_install.log | Select-String -Pattern "Error 2711|Error 1603"
              exit 1
          }
          # Check registry
          reg query "HKLM\SOFTWARE\WOW6432Node\WinFsp" /v InstallDir
          # Check headers exist
          Test-Path "C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test

      - name: Run library tests (all features)
        run: cargo test --lib --all-features
