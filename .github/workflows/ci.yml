name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (fuse feature)
        run: cargo clippy --features fuse -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test

      - name: Run library tests (fuse feature)
        run: cargo test --lib --features fuse

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libxkbcommon-dev libwayland-dev libvulkan-dev \
                libfuse-dev pkg-config
            features: "--features fuse"
          - os: macos-latest
            deps: ""
            features: ""
          - os: windows-latest
            deps: ""
            features: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release ${{ matrix.features }}
