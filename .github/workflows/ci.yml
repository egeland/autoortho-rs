name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref, 'release-plz-') == false }} # no need to retest on releases
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure components are installed
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  cross-platform:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    if: ${{ startsWith(github.head_ref, 'release-plz-') == false }} # no need to retest on releases
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Dokan (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install dokan --version 2.0.6 -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib --all-features

      - name: Run integration tests
        run: cargo test --test integration_test
