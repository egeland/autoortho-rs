name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Install components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  cross-platform:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install WinFSP (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          msiexec /i winfsp.msi /passive /norestart INSTALLLEVEL=1001 /l* winfsp_install.log

      - name: Set WINFSP_DIR (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Prefer WOW6432Node registry key (32-bit installer path)
          try {
            $prop = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' -Name InstallDir -ErrorAction Stop
            $winFspDir = $prop.InstallDir
          } catch {
            # Fallback: try x64 registry key
            try {
              $prop = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WinFsp' -Name InstallDir -ErrorAction Stop
              $winFspDir = $prop.InstallDir
            } catch {
              # Final fallback to default install location
              $winFspDir = "C:\Program Files (x86)\WinFsp"
            }
          }
          # Verify the DLL exists; if not, check alternate locations
          if (-not (Test-Path "$winFspDir\bin\winfsp-x64.dll")) {
            # Try WinFSP launcher directory (alternate layout)
            $altDir = Get-ChildItem "C:\Program Files" -Directory -Filter "winfsp*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($altDir) { $winFspDir = $altDir.FullName }
            # Last resort: check if default exists
            if (-not (Test-Path "$winFspDir\bin\winfsp-x64.dll")) {
              Write-Error "WinFSP DLL not found in $winFspDir"
              exit 1
            }
          }
          "WINFSP_DIR=$winFspDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify WinFSP installation
        if: matrix.os == 'windows-latest'
        run: |
          # Check for MSI fatal errors
          if (Select-String -Path winfsp_install.log -Pattern "return value 3" -Quiet) {
              Write-Host "MSI fatal errors found:"
              Get-Content winfsp_install.log | Select-String -Pattern "Error 2711|Error 1603"
              exit 1
          }
          # Verify DLL exists
          Test-Path "$env:WINFSP_DIR\bin\winfsp-x64.dll"
          # Verify headers exist (one of the common locations)
          $headerPaths = @(
            "$env:WINFSP_DIR\inc\winfsp\winfsp.h",
            "$env:WINFSP_DIR\inc\winfsp.h"
          )
          $found = $false
          foreach ($h in $headerPaths) {
            if (Test-Path $h) { $found = $true; break }
          }
          if (-not $found) {
            Write-Error "WinFSP header file not found"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test

      - name: Run library tests (all features)
        run: cargo test --lib --all-features
