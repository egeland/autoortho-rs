name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ ! startsWith(github.ref_name, 'release-please-') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure components are installed
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  coverage:
    name: Coverage
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ ! startsWith(github.ref_name, 'release-please-') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfuse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info

  cross-platform:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: ${{ ! startsWith(github.ref_name, 'release-please-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Dokan (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install dokany2 -y
          # Set Dokan library path for dokan-sys
          $dokanPath = "C:\Program Files\Dokan\Dokan 2.0"
          if (Test-Path $dokanPath) {
            "LIB=$dokanPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$dokanPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Dokan found at: $dokanPath"
          } else {
            Write-Host "Dokan not found in default path"
            # Try Chocolatey tools path
            $chocoPath = "C:\ProgramData\chocolatey\lib\dokany2\tools"
            if (Test-Path $chocoPath) {
              "LIB=$chocoPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "$chocoPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Windows runner has ~14GB free disk; the full target/ for this
          # workspace (with iced/wgpu UI deps + simulator) can exceed the
          # remaining 10GB cache limit when zstd-compressed on save. Cache
          # only the cargo registry on Windows to keep cache saves reliable.
          cache-targets: ${{ matrix.os != 'windows-latest' }}

      - name: Run library tests
        run: cargo test --lib --all-features
        if: matrix.os != 'windows-latest'

      - name: Run library tests (Windows)
        run: cargo test --lib --no-default-features
        if: matrix.os == 'windows-latest'

      - name: Run integration tests
        run: cargo test --test integration_test
        if: matrix.os != 'windows-latest'

      - name: Build with fuse feature (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --all-features
          ./target/debug/autoortho --help
          ./target/debug/autoortho --version

      - name: Run xplane-simulator tests
        run: cargo test -p xplane-simulator --all-targets

      - name: Build xplane-simulator
        run: cargo build -p xplane-simulator

      - name: Verify xplane-simulator runs
        run: ./target/debug/xplane-simulator --help

      - name: Upload xplane-simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: xplane-simulator-${{ matrix.os }}
          path: |
            target/debug/xplane-simulator
            target/debug/xplane-simulator.exe
            target/debug/xplane-simulator.pdb
