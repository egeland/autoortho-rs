name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
    - name: Determine release tag
      id: determine-tag
      run: |
        $tag = "${{ github.event.release.tag_name || inputs.tag }}"
        if (-not $tag) {
            Write-Host "ERROR: No tag provided!"
            exit 1
        }
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.determine-tag.outputs.tag }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build Windows binary
      run: |
        cargo build --release --target x86_64-pc-windows-msvc
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        Copy-Item "target/x86_64-pc-windows-msvc/release/autoortho.exe" -Destination "artifacts/autoortho.exe" -Force

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path "artifacts/autoortho.exe" -DestinationPath "autoortho-x86_64-pc-windows-msvc.zip"

    - name: Install WiX CLI
      run: dotnet tool install --global wix

    - name: Debug - list files
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Contents: $(Get-ChildItem -Recurse | Select-Object -First 20)"

    - name: Build MSI installer
      run: wix build wix/main.wxs -o autoortho-x86_64-pc-windows-msvc.msi

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.determine-tag.outputs.tag }}
        files: |
          autoortho-x86_64-pc-windows-msvc.zip
          autoortho-x86_64-pc-windows-msvc.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}