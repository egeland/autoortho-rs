name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download Windows binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view ${{ inputs.tag }} --json assets | ConvertFrom-Json
          Write-Host "Debug: Asset count = $($assets.assets.Count)"
          foreach ($a in $assets.assets) {
            Write-Host "Debug: Found asset: $($a.name)"
          }
          $zipAsset = $assets.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          if ($null -eq $zipAsset) {
            Write-Host "ERROR: No zip asset found!"
            exit 1
          }
          $zipUrl = $zipAsset.browser_download_url
          Write-Host "Downloading: $zipUrl"
          Invoke-WebRequest -Uri $zipUrl -OutFile "autoortho.zip"
          Expand-Archive -Path autoortho.zip -DestinationPath artifacts -Force
          Get-ChildItem artifacts

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create NSIS installer
        run: |
          $exe = Get-ChildItem -Path artifacts -Filter "*.exe" -Recurse | Select-Object -First 1
          Write-Host "Found exe: $($exe.FullName)"

          $nsisScript = @"
          !include "MUI2.nsh"
          Name "autoortho"
          OutFile "autoortho-setup.exe"
          InstallDir "`$PROGRAMFILES64\autoortho`"
          Section "Install"
            SetOutPath "`$INSTDIR`"
            File "$($exe.FullName)"
          SectionEnd
          "@

          $nsisScript | Out-File -FilePath installer.nsi -Encoding ASCII
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          Get-ChildItem autoortho-setup.exe

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: autoortho-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}