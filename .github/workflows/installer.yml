name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download Windows binary from release
        run: |
          gh release download ${{ inputs.tag }} --pattern "*.zip" --dir artifacts --repo ${{ github.repository }}
          cd artifacts
          unzip -o *.zip
          ls -la

      - name: Create Inno Setup installer
        uses: amake/innosetup-docker@latest
        with:
          script: installer.iss

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: autoortho-setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}