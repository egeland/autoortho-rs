name: Release
permissions:
  contents: write

on:
  push:
    # Trigger only on version tags, which release-please will push once a version is ready.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    # This job now only runs for tags or manual dispatches, avoiding unnecessary builds on main.
    if: |
      github.ref_type == 'tag' || 
      github.event_name == 'workflow_dispatch'
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.determine_tag.outputs.tag }}
      tag-flag: ${{ steps.determine_tag.outputs.tag-flag }}
      publishing: ${{ steps.determine_tag.outputs.publishing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Determine tag
        id: determine_tag
        shell: bash
        run: |
          if [[ "${{ inputs.tag }}" != "dry-run" && -n "${{ inputs.tag }}" ]]; then
            # Manual dispatch with a specific tag (not dry-run)
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Triggered by a tag push
            TAG="${{ github.ref_name }}"
          else
            # For dry-run or other cases, extract version from Cargo.toml
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${TAG}" && "${TAG}" != "dry-run" ]]; then
            echo "tag-flag=--tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          else
            # For dry-run, we still need a tag-flag for build step, use the version from Cargo.toml
            echo "tag-flag=--tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"

      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        run: |
          dist ${{ (github.ref_type == 'tag' && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dokany (Windows)
        if: contains(matrix.targets, 'x86_64-pc-windows-msvc')
        run: |
          choco install dokany2 -y
          # Set Dokan library path for dokan-sys
          $dokanPath = "C:\Program Files\Dokan\Dokan 2.0"
          if (Test-Path $dokanPath) {
            "LIB=$dokanPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "DOKAN_DIR=$dokanPath\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$dokanPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Dokan found at: $dokanPath"
          } else {
            Write-Host "Dokan not found in default path"
            # Try Chocolatey tools path
            $chocoPath = "C:\ProgramData\chocolatey\lib\dokany2\tools"
            if (Test-Path $chocoPath) {
              "LIB=$chocoPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "DOKAN_DIR=$chocoPath\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "$chocoPath\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json

      - name: Inject Dokany DLL into Zip (Windows)
        if: contains(matrix.targets, 'x86_64-pc-windows-msvc')
        run: |
          $zipFile = Get-ChildItem -Path "target/distrib" -Filter "*.zip" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipFile, 'Update')
          $prefix = ($zip.Entries | Where-Object { $_.Name -eq 'autoortho.exe' }).FullName -replace 'autoortho\.exe$', ''
          [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, "$env:DOKAN_DIR\dokan2.dll", "${prefix}dokan2.dll")
          $zip.Dispose()

      - id: cargo-dist
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Upload global artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: ${{ steps.cargo-dist.outputs.paths }}

  host:
    needs: [plan, build-local-artifacts, build-global-artifacts]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - id: host
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          echo "$ANNOUNCEMENT_BODY" > release_notes.txt
          gh release create "${{ needs.plan.outputs.tag }}" \
            --title "$ANNOUNCEMENT_TITLE" \
            --notes-file release_notes.txt \
            artifacts/*