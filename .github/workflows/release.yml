name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string

# Required permissions for cargo-dist
permissions:
  contents: write

jobs:
  release:
    uses: cargo-dist/gha-dist@v0.31.0
    with:
      cargo-dist-version: "0.31.0"
      tag: ${{ inputs.tag }}
