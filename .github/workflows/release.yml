name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true

# Required permissions for cargo-dist
permissions:
  contents: write

jobs:
  release:
    uses: cargo-dist/gha-dist@v0.31.0
    with:
      cargo-dist-version: "0.31.0"
