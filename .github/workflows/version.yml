name: Version Bump

on:
  workflow_run:
    workflows: [Cross-Platform Test, Security]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      workflow_run.event == 'push' &&
      workflow_run.conclusion == 'success' &&
      !contains(github.commit.message, 'chore: release-please')
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: rust
          token: ${{ secrets.GITHUB_TOKEN }}
