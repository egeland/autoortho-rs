name: Version Bump

on:
  workflow_run:
    workflows: [Cross-Platform Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Auto-merge release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh pr merge ${{ fromJSON(steps.release.outputs.pr).number }} \
            --repo ${{ github.repository }} \
            --squash --auto

      - name: Recreate tag to trigger release build
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          SHA="${{ steps.release.outputs.sha }}"
          echo "Recreating tag $TAG at $SHA to trigger release workflow"
          # Delete the tag created by release-please
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" || true
          # Recreate it — PAT-created refs trigger push events
          gh api "repos/${{ github.repository }}/git/refs" \
            --input - <<EOF
          {"ref":"refs/tags/$TAG","sha":"$SHA"}
          EOF
