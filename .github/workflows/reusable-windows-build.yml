name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      build-mode:
        description: Cargo build mode (debug or release)
        required: false
        default: release
        type: string
      run-tests:
        description: Run tests after build
        required: false
        default: false
        type: boolean
      create-artifact:
        description: Create and upload zip artifact
        required: false
        default: true
        type: boolean
      artifact-name:
        description: Name for the uploaded artifact
        required: false
        default: autoortho-windows
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded artifact
        value: ${{ inputs.artifact-name }}

jobs:
  build:
    name: Windows Build (${{ inputs.build-mode }})
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install WinFSP
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i winfsp.msi /qn /norestart INSTALLLEVEL=1001" -Wait -NoNewWindow

          $regPath32 = 'HKLM:\SOFTWARE\WOW6432Node\WinFsp'
          $regPath64 = 'HKLM:\SOFTWARE\WinFsp'

          if (Test-Path $regPath32) {
              $winFspDir = (Get-ItemProperty -Path $regPath32 -Name InstallDir).InstallDir
          } elseif (Test-Path $regPath64) {
              $winFspDir = (Get-ItemProperty -Path $regPath64 -Name InstallDir).InstallDir
          } else {
              $winFspDir = "C:\Program Files (x86)\WinFsp\"
          }

          Write-Host "WinFSP found at: $winFspDir"
          "WINFSP_DIR=$winFspDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$winFspDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (${{ inputs.build-mode }})
        run: cargo build --${{ inputs.build-mode }}

      - name: Run library tests
        if: ${{ inputs.run-tests }}
        run: cargo test --lib

      - name: Run integration tests
        if: ${{ inputs.run-tests }}
        run: cargo test --test integration_test

      - name: Create zip artifact
        if: ${{ inputs.create-artifact }}
        run: |
          $exePath = "target\${{ inputs.build-mode }}\autoortho.exe"
          $dllPath = "$env:WINFSP_DIR\bin\winfsp-x64.dll"
          $zipFile = "autoortho-windows.zip"
          
          Compress-Archive -Path $exePath, $dllPath -DestinationPath $zipFile
          
          Write-Host "Created $zipFile"
          Get-Item $zipFile | Select-Object Name, Length

      - name: Upload artifact
        if: ${{ inputs.create-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: autoortho-windows.zip
