name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      build-mode:
        description: Cargo build mode (debug or release)
        required: false
        default: release
        type: string
      run-tests:
        description: Run tests after build
        required: false
        default: false
        type: boolean
      create-artifact:
        description: Create and upload zip artifact
        required: false
        default: true
        type: boolean
      artifact-name:
        description: Name for the uploaded artifact
        required: false
        default: autoortho-windows
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded artifact
        value: ${{ inputs.artifact-name }}

jobs:
  build:
    name: Windows Build (${{ inputs.build-mode }})
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Dokany
        run: |
          Invoke-WebRequest -Uri "https://github.com/dokan-dev/dokan/releases/download/v1.1.2/DokanSetup_1.1.2.exe" -OutFile DokanSetup.exe
          Start-Process -FilePath ".\DokanSetup.exe" -ArgumentList "/DOKAN_NO_DESKTOP /DOKAN_SILENT_INSTALL" -Wait -NoNewWindow

          $regPath = 'HKLM:\SOFTWARE\Dokan'

          if (Test-Path $regPath) {
              $dokanDir = (Get-ItemProperty -Path $regPath -Name InstallPath).InstallPath
          } else {
              $dokanDir = "C:\Program Files\Dokan\Dokan Library v1.1"
          }

          Write-Host "Dokany found at: $dokanDir"
          "DOKAN_DIR=$dokanDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$dokanDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (${{ inputs.build-mode }})
        run: cargo build --${{ inputs.build-mode }}

      - name: Run library tests
        if: ${{ inputs.run-tests }}
        run: cargo test --lib

      - name: Run integration tests
        if: ${{ inputs.run-tests }}
        run: cargo test --test integration_test

      - name: Create zip artifact
        if: ${{ inputs.create-artifact }}
        run: |
          $exePath = "target\${{ inputs.build-mode }}\autoortho.exe"
          $dllPath = "$env:DOKAN_DIR\Dokan.dll"
          $zipFile = "autoortho-windows.zip"
          
          Compress-Archive -Path $exePath, $dllPath -DestinationPath $zipFile
          
          Write-Host "Created $zipFile"
          Get-Item $zipFile | Select-Object Name, Length

      - name: Upload artifact
        if: ${{ inputs.create-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: autoortho-windows.zip